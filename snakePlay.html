<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsirNet | Snake Game</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        /* টপ হেডার বার (ব্যাক ও রিসেট বাটন ডানে-বামে) */
        .top-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
            margin-bottom: 5px;
        }
        .top-btn {
            background-color: #1e1e1e;
            color: #00ffcc;
            border: 2px solid #333;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .top-btn:active {
            background-color: #00ffcc;
            color: #000;
        }
        .back-btn {
            color: #4da6ff;
            border-color: #2b4c7e;
        }
        .back-btn:active {
            background-color: #4da6ff;
            color: #000;
        }
        .reset-btn {
            color: #ff4d4d;
            border-color: #7e2b2b;
        }
        .reset-btn:active {
            background-color: #ff4d4d;
            color: #fff;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
        }
        .scoreboard {
            font-size: 15px;
            margin-bottom: 8px;
            display: flex;
            gap: 15px;
        }
        canvas {
            border: 3px solid #00ffcc;
            background-color: #000000;
            box-shadow: 0px 0px 15px rgba(0, 255, 204, 0.4);
            max-width: 95vw;
            max-height: 48vh;
        }
        .controls-panel {
            margin-top: 8px;
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 14px;
            justify-content: center;
        }
        .btn {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 6px 12px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:active {
            background-color: #00b386;
        }

        /* অন-স্ক্রিন এসভিজি বাটন স্টাইল */
        .mobile-controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 50px);
            gap: 6px;
            margin-top: 8px;
        }
        .m-btn {
            background-color: #1e1e1e;
            color: #00ffcc;
            border: 2px solid #333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
        }
        .m-btn svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }
        .m-btn:active {
            background-color: #00ffcc;
            color: #000;
            transform: scale(0.95);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        /* কাস্টম অ্যালার্ট মোডাল */
        #customAlert {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .alert-box {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #00ffcc;
            text-align: center;
            width: 300px;
            box-shadow: 0 0 20px rgba(0,255,204,0.3);
        }
        .alert-box h2 { color: #ff4d4d; margin-top: 0; }
        .alert-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .quit-btn {
            background-color: #ff4d4d;
            color: #fff;
        }
        .quit-btn:active {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <!-- পেজের একদম উপরে দুই পাশে Back এবং Reset বাটন -->
    <div class="top-bar">
        <button class="top-btn back-btn" onclick="history.back()">Back</button>
        <button class="top-btn reset-btn" onclick="restartGame()">Reset</button>
    </div>

    <h1>Snake Game</h1>
    <div class="scoreboard">
        <div>Score: <span id="score">0</span></div>
        <div>Speed: <span id="speedVal">Normal</span></div>
        <div>Time: <span id="timer">00:00</span></div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <!-- স্পিড কন্ট্রোল প্যানেল -->
    <div class="controls-panel">
        <span>Speed:</span>
        <button class="btn" onclick="changeSpeed('slow')">Slow</button>
        <button class="btn" onclick="changeSpeed('normal')">Normal</button>
        <button class="btn" onclick="changeSpeed('fast')">Fast</button>
    </div>

    <!-- মোবাইল টাচ কন্ট্রোল (SVG Icons) -->
    <div class="mobile-controls">
        <!-- Up Arrow -->
        <div class="m-btn" id="btn-up" onclick="setDir(0, -1)">
            <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
        </div>
        <!-- Left Arrow -->
        <div class="m-btn" id="btn-left" onclick="setDir(-1, 0)">
            <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
        </div>
        <!-- Down Arrow -->
        <div class="m-btn" id="btn-down" onclick="setDir(0, 1)">
            <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
        </div>
        <!-- Right Arrow -->
        <div class="m-btn" id="btn-right" onclick="setDir(1, 0)">
            <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
        </div>
    </div>

    <!-- কাস্টম অ্যালার্ট বক্স -->
    <div id="customAlert">
        <div class="alert-box">
            <h2>Game Over!</h2>
            <p>Your Final Score: <span id="finalScore">0</span></p>
            <p>Time Played: <span id="finalTime">00:00</span></p>
            <div class="alert-btns">
                <button class="btn" onclick="restartGame()">Play Again</button>
                <button class="btn quit-btn" onclick="history.back()">Quit</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const speedValElement = document.getElementById("speedVal");
        const timerElement = document.getElementById("timer");
        const customAlert = document.getElementById("customAlert");
        const finalScoreElement = document.getElementById("finalScore");
        const finalTimeElement = document.getElementById("finalTime");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let timerInterval;
        let secondsElapsed = 0;
        let gameSpeed = 120;
        let changingDirection = false;

        function initGame() {
            generateFood();
            startInterval();
            startTimer();
        }

        function startInterval() {
            clearInterval(gameInterval);
            gameInterval = setInterval(main, gameSpeed);
        }

        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            timerElement.innerText = "00:00";
            timerInterval = setInterval(() => {
                secondsElapsed++;
                let mins = Math.floor(secondsElapsed / 60);
                let secs = secondsElapsed % 60;
                timerElement.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }, 1000);
        }

        function main() {
            if (hasGameEnded()) {
                clearInterval(gameInterval);
                clearInterval(timerInterval);
                finalScoreElement.innerText = score;
                finalTimeElement.innerText = timerElement.innerText;
                customAlert.style.display = "flex";
                return;
            }
            
            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#00ffcc" : "#00aa88";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            let head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0) head.x = tileCount - 1;
            if (head.x >= tileCount) head.x = 0;
            if (head.y < 0) head.y = tileCount - 1;
            if (head.y >= tileCount) head.y = 0;

            snake.unshift(head);

            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        function drawFood() {
            ctx.fillStyle = "#ff4d4d";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function hasGameEnded() {
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return false;
        }

        function setDir(newDx, newDy) {
            if (changingDirection) return;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (newDx === -1 && !goingRight) { dx = -1; dy = 0; changingDirection = true; }
            if (newDx === 1 && !goingLeft) { dx = 1; dy = 0; changingDirection = true; }
            if (newDy === -1 && !goingDown) { dx = 0; dy = -1; changingDirection = true; }
            if (newDy === 1 && !goingUp) { dx = 0; dy = 1; changingDirection = true; }
        }

        document.addEventListener("keydown", event => {
            if (event.keyCode === 37) setDir(-1, 0); 
            if (event.keyCode === 38) setDir(0, -1); 
            if (event.keyCode === 39) setDir(1, 0);  
            if (event.keyCode === 40) setDir(0, 1);  
        });

        function changeSpeed(level) {
            if (level === 'slow') {
                gameSpeed = 180;
                speedValElement.innerText = "Slow";
            } else if (level === 'normal') {
                gameSpeed = 120;
                speedValElement.innerText = "Normal";
            } else if (level === 'fast') {
                gameSpeed = 70;
                speedValElement.innerText = "Fast";
            }
            startInterval();
        }

        function restartGame() {
            customAlert.style.display = "none";
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            initGame();
        }

        initGame();
    </script>
</body>
</html>
