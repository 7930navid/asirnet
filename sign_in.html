<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AsirNet Login</title>

<!-- FontAwesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="icon" href="https://i.ibb.co.com/2mLxg7s/asirnet-just-logo.png">

 
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
    radial-gradient(circle at top left,#0f172a,#020617 60%);
    position:relative;
}

/* Animated background glow */
body::before,
body::after{
    content:'';
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    filter:blur(90px);
    animation:float 8s ease-in-out infinite;
}

body::before{
    background:#00f7ff;
    top:-150px;
    left:-120px;
}

body::after{
    background:#7c3aed;
    bottom:-150px;
    right:-120px;
    animation-delay:4s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(30px);
    }
}

/* Login Card */

.login-box{
    width:380px;
    padding:45px 35px;
    border-radius:28px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:
    0 0 40px rgba(0,0,0,0.4),
    inset 0 0 20px rgba(255,255,255,0.03);
    position:relative;
    z-index:10;
    overflow:hidden;
    animation:cardShow 1s ease;
}

@keyframes cardShow{
    from{
        opacity:0;
        transform:translateY(40px) scale(.95);
    }
    to{
        opacity:1;
        transform:translateY(0px) scale(1);
    }
}

.login-box::before{
    content:'';
    position:absolute;
    width:180px;
    height:180px;
    background:linear-gradient(45deg,#00f7ff,#7c3aed);
    border-radius:50%;
    top:-90px;
    right:-90px;
    opacity:.25;
}

.logo{
    color:#fff;
    text-align:center;
    margin-bottom:35px;
    padding: 20px;
    background: rgba(255,255,255,0.4);
    border-radius: 10px;
}

.logo img{
    width: 150px;
    border-radius: 20px;
}

.logo p{
    margin-top:8px;
    color: gray;
    font-size:14px;
}

/* Inputs with Icons & Floating Label Fix */

.input-group{
    position:relative;
    margin-bottom:28px;
}

.input-group i {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    font-size: 16px;
    transition: .3s;
    z-index: 2;
    pointer-events: none;
}

.input-group input{
    width:100%;
    padding:16px 18px 16px 48px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    outline:none;
    border-radius:14px;
    color:#fff;
    font-size:15px;
    transition:.35s ease;
}

.input-group input:focus{
    border-color:#00f7ff;
    box-shadow: 0 0 15px rgba(0,247,255,.35);
    transform:translateY(-2px);
}

.input-group input:focus ~ i {
    color: #00f7ff;
}

.input-group label{
    position:absolute;
    left:48px;
    top:50%;
    transform:translateY(-50%);
    color:#94a3b8;
    pointer-events:none;
    transition:.3s;
    background:transparent;
    padding: 0 4px;
}

.input-group input:focus ~ label,
.input-group input:not(:placeholder-shown) ~ label {
    top: 0px;
    left: 14px;
    font-size: 12px;
    color: #00f7ff;
    background: #0f172a;
    border-radius: 4px;
    transform: translateY(-50%);
}

/* Button */

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#00f7ff,#7c3aed);
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.35s ease;
    position:relative;
    overflow:hidden;
}

.login-btn::before{
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:rgba(255,255,255,0.2);
    transform:skewX(-25deg);
    transition:.6s;
}

.login-btn:hover::before{
    left:120%;
}

.login-btn:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow: 0 12px 25px rgba(124,58,237,.4), 0 0 20px rgba(0,247,255,.35);
}

.login-btn:active{
    transform:scale(.98);
}

/* Bottom text */

.bottom-text{
    text-align:center;
    margin-top:24px;
    color:#94a3b8;
    font-size:13px;
}

.bottom-text span{
    color:#00f7ff;
}

/* Responsive */

@media(max-width:450px){
    .login-box{
        width:92%;
        padding:40px 25px;
    }
}

section {
    padding-top: 20px;
}
section button {
    background: none;
    border: none;
    color: red;
    font-size: 15px;
    padding: 0;
    cursor: pointer;
}
section button:focus {
    outline: none;
    color: #00e5ff;
    transform: translateY(-2px);
    text-shadow: 0 0 10px rgba(0,229,255,0.6);
    position: relative;
}

.guest-btn {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: 1px solid rgba(0, 247, 255, 0.5);
    border-radius: 14px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(135deg, rgba(0, 247, 255, 0.15), rgba(124, 58, 237, 0.25), rgba(0, 247, 255, 0.15));
    background-size: 200% 200%;
    box-shadow: 0 0 12px rgba(0, 247, 255, 0.2);
    animation: gradientShift 4s ease infinite, breath 2.5s ease-in-out infinite;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.guest-btn:hover {
    transform: scale(1.03) translateY(-2px);
    border-color: #00f7ff;
    box-shadow: 0 0 20px rgba(0, 247, 255, 0.5);
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes breath {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <img src="https://i.ibb.co.com/qZNWM80/Asirnet-adv-logo-png.png" alt="AsirNet Logo">
        <p>Secure Premium Access</p>
    </div>

    <form>

        <div class="input-group">
            <input type="email" placeholder=" " required>
            <i class="fa-solid fa-envelope"></i>
            <label>Email Address</label>
        </div>

        <div class="input-group">
            <input type="password" placeholder=" " required>
            <i class="fa-solid fa-lock"></i>
            <label>Passkey</label>
        </div>
        
        <button class="login-btn">
            Login
        </button>

    </form>

    <!-- Guest Login Button -->
    <button type="button" class="guest-btn" onclick="continueAsGuest()">
        Continue as Guest
    </button>

    <section>
         <button type="button" onclick="forgot()">Forgot password?</button>
         <a href="register.html"><button type="button">Create a new account?</button></a>
    </section>

    <div class="bottom-text">
        Protected by <span>W-deploy</span>
    </div>

</div>

</body>
<script>

const form = document.querySelector("form");
const loginBtn = document.querySelector(".login-btn");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.querySelector('input[type="email"]').value.trim();
    const password = document.querySelector('input[type="password"]').value.trim();

    if (!email || !password) {
        alert("Please fill all fields");
        return;
    }

    loginBtn.disabled = true;
    loginBtn.innerText = "Authenticating...";

    try {
        const res = await fetch("https://users-server-xyvg.onrender.com/signin", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email,
                password
            })
        });

        const data = await res.json();

        if (!res.ok) {
            alert(data.message || "Login failed");
            loginBtn.disabled = false;
            loginBtn.innerText = "Login";
            return;
        }

        // 🔐 1. SAVE TOKEN
        localStorage.setItem("token", data.token);

        // 🔐 2. SAFE USER SAVE (NO PASSWORD)
        const user = {
            id: data.user.id,
            username: data.user.username,
            email: data.user.email,
            bio: data.user.bio,
            avatar: data.user.avatar,
            cover_photo: data.user.cover_photo
        };
        localStorage.setItem("user", JSON.stringify(user));

        // 🔐 3. FETCH & SAVE USER'S PAGES ARRAY (/user-by-email route)
        loginBtn.innerText = "Loading Pages...";
        try {
            const pagesRes = await fetch(`https://page-server-jqce.onrender.com/user-by-email?email=${encodeURIComponent(email)}`, {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${data.token}`,
                    "Content-Type": "application/json"
                }
            });
            
            if (pagesRes.ok) {
                const pagesData = await pagesRes.json();
                
                const pagesArray = Array.isArray(pagesData.data) ? pagesData.data : (pagesData.pages || []);
                localStorage.setItem("page", JSON.stringify(pagesArray));
            } else {
                localStorage.setItem("page", JSON.stringify([]));
            }
        } catch (pageErr) {
            console.error("Could not fetch pages:", pageErr);
            localStorage.setItem("page", JSON.stringify([]));
        }

        loginBtn.innerText = "Success ✓";
        alert("Login successful!");

        setTimeout(() => {
            window.location.href = "asirnet";
        }, 800);

    } catch (err) {
        console.error(err);
        alert("Network / server error");
        loginBtn.disabled = false;
        loginBtn.innerText = "Login";
    }
});


async function forgot() {
  const email = document.querySelector('input[type="email"]').value.trim();

  if (!email) {
    alert("Enter email first");
    return;
  }

  try {
    const res = await fetch("https://users-server-xyvg.onrender.com/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });

    const data = await res.json();
    alert(data.message || "Check your email");
  } catch (err) {
    console.error(err);
    alert("Server error");
  }
}

function continueAsGuest() {
    localStorage.setItem("isGuest", "true");
    window.location.href = "guest.html";
}

</script>
</html>
